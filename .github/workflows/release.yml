# SPDX-License-Identifier: CC0-1.0
name: Publish source release

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6
      - name: Package voice sources
        run: python3 tools/package_release.py "${GITHUB_REF_NAME#v}"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/release/*.zip --verify-tag --title "mdkit ${GITHUB_REF_NAME#v}" --notes "Thirty standalone C99 drum voices across the EFM, TRX and PI families. The source download includes voice implementations, required headers and CC0 license files."
